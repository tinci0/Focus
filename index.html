<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🌳 專注森林小島</title>
<style>
/* 清新日系配色：所有樣式內嵌，無須網路 */
:root{--ink:#213547;--muted:#52677a;--blue:#0284c7;--green:#16a34a;--line:#e2e8f0;--shadow:0 18px 45px #2135471d}
*{box-sizing:border-box}
body{margin:0;font-family:"Microsoft JhengHei",system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 15%,#bae6fd99,transparent 30%),radial-gradient(circle at 90% 10%,#f9a8d477,transparent 30%),linear-gradient(135deg,#fffaf0,#f0f9ff 55%,#fdf2f8);min-height:100vh}
button,input,select,textarea{font:inherit;max-width:100%}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #38bdf8;outline-offset:3px}
.wrap{width:min(1100px,calc(100% - 28px));margin:auto;padding:24px 0 48px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#ffffffc9;border:1px solid white;border-radius:999px;padding:12px 20px;box-shadow:0 10px 25px #21354712;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900}.logo{display:grid;place-items:center;width:42px;height:42px;border-radius:15px;background:linear-gradient(135deg,#0284c7,#16a34a);color:white;font-size:23px}
.pill{border-radius:999px;background:#dcfce7;color:#166534;padding:9px 14px;font-weight:800;font-size:14px}
h1{font-size:clamp(32px,5vw,54px);line-height:1.18;margin:13px 0}.accent{background:linear-gradient(100deg,#0284c7,#16a34a,#db2777);color:transparent;background-clip:text}
.intro{line-height:1.85;color:var(--muted);margin:0 0 22px}
.grid{display:grid;grid-template-columns:1fr 1.04fr;gap:20px;align-items:stretch}
.card{background:#ffffffd9;border:1px solid #fff;border-radius:30px;box-shadow:var(--shadow);padding:clamp(20px,3vw,32px);min-width:0}
.timer-card{background:linear-gradient(145deg,#fffffff2,#e0f2fecc)}
.small-title{color:var(--blue);font-size:14px;font-weight:900;letter-spacing:.06em}
h2{margin:5px 0 16px;font-size:23px}
.field{display:grid;grid-template-columns:1fr 125px;gap:12px;align-items:center;margin:14px 0}
label{font-weight:800}.field input{width:100%;padding:13px 12px;border:2px solid #cbd5e1;border-radius:15px;background:white;color:var(--ink);text-align:center;font-weight:900;font-size:19px}
.presets{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 22px}
.btn{border:0;border-radius:16px;background:linear-gradient(125deg,#0284c7,#16a34a);color:white;padding:13px 17px;font-weight:900;box-shadow:0 8px 18px #0284c72b;transition:transform .15s}
.btn:hover:not(:disabled){transform:translateY(-2px)}
.btn.secondary{background:white;border:1px solid #cbd5e1;color:#155e75;box-shadow:none}
.btn.warn{background:#fff0f0;border:1px solid #fecaca;color:#b91c1c;box-shadow:none}
.btn:disabled{opacity:.48;cursor:not-allowed}
.presets .btn{font-size:14px;padding:9px 13px}
.clock{position:relative;text-align:center;background:#ffffffb5;border:1px solid #dbeafe;border-radius:26px;padding:23px 8px;margin:8px 0 18px}
#clock{font-size:clamp(57px,8vw,98px);line-height:1.25;font-weight:950;font-variant-numeric:tabular-nums;letter-spacing:-.045em;color:#0369a1}
#status{font-size:14px;font-weight:800;color:#52677a;min-height:24px}
.track{height:11px;background:#dbeafe;border-radius:99px;overflow:hidden;margin-top:15px}
#bar{height:100%;background:linear-gradient(90deg,#38bdf8,#4ade80);width:0%;transition:width .3s}
.actions{display:flex;flex-wrap:wrap;gap:9px}
.message{margin:13px 0 0;min-height:25px;color:#166534;font-weight:800;line-height:1.5}
.island-card{background:linear-gradient(155deg,#e0f2fe,#fff 58%,#dcfce7)}
.island-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.island-head h2{margin:4px 0 0}
.scene{position:relative;isolation:isolate;height:350px;overflow:hidden;border-radius:25px;background:linear-gradient(#8bd8fc 0%,#dff7ff 66%,#9ce4ed 66%,#4bc0d8 100%);margin-top:18px}
.sun{position:absolute;right:12%;top:9%;width:58px;height:58px;background:#ffed98;border-radius:50%;box-shadow:0 0 0 12px #fff5b844,0 0 45px #fff3a3}
.cloud{position:absolute;top:19%;left:10%;font-size:49px;opacity:.87}
.cloud.two{left:64%;top:31%;font-size:31px}
.water{position:absolute;bottom:6%;left:8%;right:8%;height:16px;border-top:3px dashed #ffffff8c;border-radius:50%}
.land-shadow{position:absolute;left:10%;right:10%;bottom:11%;height:43%;background:#26866b;border-radius:50%;filter:blur(2px)}
.land{position:absolute;left:9%;right:9%;bottom:14%;height:44%;background:radial-gradient(ellipse at 42% 28%,#b7ee9b,#73c977 65%,#409c71);border:9px solid #e9d995;border-radius:50%;box-shadow:0 14px 0 #c8a669}
#trees{position:absolute;inset:0;z-index:3;pointer-events:none}
.tree{position:absolute;transform:translate(-50%,-85%);filter:drop-shadow(0 4px 2px #14532d33);animation:grow .5s backwards;font-size:clamp(24px,3.5vw,38px)}
@keyframes grow{from{transform:translate(-50%,-70%) scale(.2);opacity:0}to{transform:translate(-50%,-85%) scale(1);opacity:1}}
.hut{position:absolute;left:48%;bottom:28%;font-size:40px;transform:translateX(-50%);z-index:2}
.empty{position:absolute;inset:auto 10% 8px;text-align:center;color:#075985;background:#ffffffd9;border-radius:20px;padding:7px;font-size:13px;font-weight:800;z-index:4}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}
.stat{background:#ffffffba;border-radius:16px;text-align:center;padding:13px 5px}
.stat strong{font-size:clamp(22px,3vw,31px);display:block;color:#15803d}.stat span{font-size:12px;color:#52677a;font-weight:800}
.bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:19px}
.note{font-size:13px;color:var(--muted);line-height:1.7;margin:0;flex:1 1 300px}
footer{text-align:center;color:#64748b;font-size:13px;margin-top:25px}
/* RWD：手機直向堆疊兩張主卡，避免輸入與按鈕超出畫面 */
@media(max-width:760px){.grid{grid-template-columns:1fr}.scene{height:330px}.topbar{padding:10px 13px}.pill{font-size:12px}.card{border-radius:25px}.actions .btn{flex:1 1 42%}}
@media(max-width:380px){.field{grid-template-columns:1fr 105px}.scene{height:290px}.tree{font-size:25px}.stats{gap:6px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
<header class="topbar"><div class="brand"><span class="logo">🌱</span><span>專注森林小島</span></div><span class="pill">✨ 一次專注，一棵樹</span></header>
<h1>讓每段專注，<span class="accent">長成一片森林。</span></h1>
<p class="intro">設定今天的專注任務，按下開始後靜心完成倒數。每完成一輪，你的小島就會多一棵可愛的樹！</p>
<div class="grid">
<section class="card timer-card" aria-labelledby="focusTitle">
<div class="small-title">⏳ FOCUS TIME</div><h2 id="focusTitle">開始今天的專注旅程</h2>
<div class="field"><label for="minutes">每輪專注時間（分鐘）</label><input id="minutes" type="number" min="1" max="180" step="1" value="25" inputmode="numeric"></div>
<div class="presets" aria-label="快速設定時間"><button class="btn secondary preset" data-min="5">5 分鐘</button><button class="btn secondary preset" data-min="15">15 分鐘</button><button class="btn secondary preset" data-min="25">25 分鐘</button><button class="btn secondary preset" data-min="45">45 分鐘</button></div>
<div class="clock" role="timer" aria-label="剩餘專注時間"><div id="clock">25:00</div><div id="status">準備好了，就開始種樹吧！</div><div class="track"><div id="bar"></div></div></div>
<label style="display:inline-flex;gap:8px;align-items:center;margin:0 0 15px;color:#52677a;font-size:14px"><input type="checkbox" id="soundOn" checked> 完成時播放提示音</label><div class="actions"><button id="start" class="btn">▶ 開始專注</button><button id="pause" class="btn secondary" disabled>⏸ 暫停</button><button id="reset" class="btn secondary">↺ 重新設定</button></div>
<p class="message" id="message" role="status" aria-live="polite"></p>
</section>
<section class="card island-card" aria-labelledby="islandTitle">
<div class="island-head"><div><div class="small-title">🏝️ MY LITTLE ISLAND</div><h2 id="islandTitle">我的專注森林</h2></div><span class="pill" id="level">🌱 新手園丁</span></div>
<div class="scene" role="img" aria-label="顯示已完成專注任務所種植的森林"><div class="sun"></div><div class="cloud">☁️</div><div class="cloud two">☁️</div><div class="water"></div><div class="land-shadow"></div><div class="land"></div><div class="hut">🏡</div><div id="trees"></div><div class="empty" id="empty">🌱 完成第一輪專注，種下第一棵樹！</div></div>
<div class="stats"><div class="stat"><strong id="total">0</strong><span>森林樹木</span></div><div class="stat"><strong id="today">0</strong><span>今日完成</span></div><div class="stat"><strong id="hours">0</strong><span>累積分鐘</span></div></div>
</section>
</div>
<div class="bottom"><p class="note">💚 樹木和完成紀錄只儲存在這台裝置的瀏覽器。暫停或中途重設不會種樹；倒數完整結束才算完成。保持本頁開啟，切換分頁後倒數仍以實際時間計算。</p><button class="btn warn" id="clear">🗑 清空森林紀錄</button></div>
<footer>每一次專心，都是對自己的小小灌溉 ☀️</footer>
</main>
<script>
/* 專注狀態與本機儲存：不傳送任何資料到外部 */
const $=id=>document.getElementById(id);
const KEY="focus_island_forest_v1";
let records=[];
try{const saved=JSON.parse(localStorage.getItem(KEY)||"[]");if(Array.isArray(saved))records=saved.filter(x=>Number.isFinite(x.time)&&Number.isFinite(x.minutes)&&x.minutes>0)}catch(e){records=[]}
let duration=25*60,remaining=duration,deadline=0,ticker=null,mode="idle",audio=null;
const treeIcons=["🌳","🌲","🌴","🌸","🌳","🌲","🌿"];
function save(){try{localStorage.setItem(KEY,JSON.stringify(records))}catch(e){$("message").textContent="⚠️ 瀏覽器無法儲存紀錄，請檢查儲存空間或隱私設定。"}}
function localDay(t){const d=new Date(t);return [d.getFullYear(),d.getMonth(),d.getDate()].join("-")}
function renderForest(){
 const n=records.length;const today=localDay(Date.now());
 $("total").textContent=n;$("today").textContent=records.filter(x=>localDay(x.time)===today).length;
 $("hours").textContent=records.reduce((s,x)=>s+x.minutes,0);
 $("level").textContent=n>=30?"🌳 森林守護者":n>=10?"🌲 森林達人":n>=3?"🌿 綠手指":"🌱 新手園丁";
 $("empty").hidden=n>0;
 const area=$("trees");area.replaceChildren();
 // 每十棵自動縮放為一組景觀，完整完成數仍顯示於統計卡
 const show=Math.min(n,42);
 for(let i=0;i<show;i++){
  const col=i%7,row=Math.floor(i/7);
  const el=document.createElement("span");el.className="tree";
  el.textContent=treeIcons[i%treeIcons.length];
  el.style.left=(20+col*10+((row%2)*3))+"%";
  el.style.top=(59+row*4.1-(col%2)*1.2)+"%";
  el.style.zIndex=String(4+row);
  el.style.fontSize=(26+row*1.1)+"px";
  el.setAttribute("aria-hidden","true");area.appendChild(el);
 }
}
function display(){
 const seconds=Math.max(0,Math.ceil(remaining));
 $("clock").textContent=String(Math.floor(seconds/60)).padStart(2,"0")+":"+String(seconds%60).padStart(2,"0");
 $("bar").style.width=Math.min(100,Math.max(0,(duration-remaining)/duration*100))+"%";
 $("start").disabled=mode!=="idle";
 $("pause").disabled=mode==="idle";
 $("pause").textContent=mode==="paused"?"▶ 繼續":"⏸ 暫停";
 $("minutes").disabled=mode!=="idle";
 document.querySelectorAll(".preset").forEach(b=>b.disabled=mode!=="idle");
 $("status").textContent=mode==="running"?"🌿 專注中，森林正在等待你…":mode==="paused"?"☕ 已暫停，隨時繼續":mode==="done"?"🎉 完成！一棵樹長出來了":"準備好了，就開始種樹吧！";
}
function readMinutes(){
 const str=$("minutes").value.trim();const num=Number(str);
 if(!str||!Number.isInteger(num)||num<1||num>180){$("message").textContent="⚠️ 請輸入 1～180 的整數分鐘。";$("minutes").focus();return null}
 return num;
}
function setReady(){
 if(mode!=="idle")return;
 const n=readMinutes();if(n===null)return;
 duration=n*60;remaining=duration;$("message").textContent="";display();
}
function sound(){
 if(!$("soundOn")?.checked)return;
 try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume();
 [0,.18,.36].forEach((offset,i)=>{const osc=audio.createOscillator(),gain=audio.createGain();osc.type="sine";osc.frequency.value=[523,659,784][i];gain.gain.setValueAtTime(.0001,audio.currentTime+offset);gain.gain.exponentialRampToValueAtTime(.16,audio.currentTime+offset+.015);gain.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+offset+.25);osc.connect(gain).connect(audio.destination);osc.start(audio.currentTime+offset);osc.stop(audio.currentTime+offset+.27)})}catch(e){}
}
function finish(){
 if(mode!=="running")return;
 clearInterval(ticker);ticker=null;remaining=0;mode="done";
 records.push({time:Date.now(),minutes:duration/60});save();renderForest();display();sound();
 $("message").textContent="🎊 太棒了！你成功完成一輪專注，小島又多了一棵樹！";
 $("start").disabled=true;
}
function tick(){if(mode!=="running")return;remaining=Math.max(0,(deadline-Date.now())/1000);if(remaining<=0)finish();else display()}
$("start").addEventListener("click",()=>{
 if(mode!=="idle")return;
 const n=readMinutes();if(n===null)return;
 duration=n*60;remaining=duration;mode="running";deadline=Date.now()+duration*1000;
 $("message").textContent="🌼 已開始！保持專注，讓小樹成長。";
 if(audio===null&&window.AudioContext){try{audio=new AudioContext()}catch(e){}}
 ticker=setInterval(tick,250);display();
});
$("pause").addEventListener("click",()=>{
 if(mode==="running"){tick();if(mode!=="running")return;clearInterval(ticker);ticker=null;mode="paused"}
 else if(mode==="paused"){deadline=Date.now()+remaining*1000;mode="running";ticker=setInterval(tick,250)}
 display()
});
$("reset").addEventListener("click",()=>{
 clearInterval(ticker);ticker=null;mode="idle";
 const n=Number($("minutes").value);duration=Number.isInteger(n)&&n>=1&&n<=180?n*60:25*60;remaining=duration;
 $("message").textContent="已重新設定。尚未完成的這輪不會種樹。";display();
});
document.querySelectorAll(".preset").forEach(btn=>btn.addEventListener("click",()=>{$("minutes").value=btn.dataset.min;setReady()}));
$("minutes").addEventListener("change",setReady);
$("clear").addEventListener("click",()=>{
 if(!records.length){$("message").textContent="森林目前沒有需要清除的紀錄。";return}
 if(!confirm("確定清空全部森林紀錄嗎？這個操作無法復原。"))return;
 records=[];save();renderForest();$("message").textContent="已清空森林紀錄，隨時可以重新種植。";
});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)tick()});
/* 初始化：已有紀錄會恢復樹木，但計時不會自動開始 */
renderForest();display();
</script>
</body>
</html>
